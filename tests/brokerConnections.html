<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/theme-init.js"></script><title>사용자 API 범위 모의 검증</title></head>
<body><div id="root"></div><div id="qa"></div><script type="module">
import React, {useState} from 'react'
import {createRoot} from 'react-dom/client'
import App from '/src/App.jsx'
import {setQaUser} from '/src/services/supabaseClient.js'
import '/src/styles.css'
function Controls() {
  const [notice,setNotice]=useState(''), [user,setUser]=useState('qa-all')
  return React.createElement('section',{style:{position:'fixed',right:12,bottom:12,zIndex:100,width:260,padding:12,background:'#142742',border:'1px solid #54759a',borderRadius:10,fontSize:12}},
    React.createElement('strong',{},'모의 검증 · 실제 App'),
    React.createElement('select',{'aria-label':'검증 사용자',value:user,onChange:e=>{setUser(e.target.value);setQaUser(e.target.value)},style:{display:'block',margin:'8px 0'}},
      ...[['qa-all','4곳 정상 · KB 지연'],['qa-partial','4곳 저장 · 토스 키 오류'],['qa-new','신규 사용자'],['','게스트']].map(([value,label])=>React.createElement('option',{key:value,value},label))),
    React.createElement('button',{onClick:async()=>setNotice(JSON.stringify(await(await fetch('/__qa/metrics')).json()))},'요청 횟수 확인'),
    React.createElement('p',{role:'status',style:{overflowWrap:'anywhere'}},notice))
}
createRoot(document.getElementById('root')).render(React.createElement(App))
createRoot(document.getElementById('qa')).render(React.createElement(Controls))
</script></body></html>
